apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: radiant-petclinic-hpa
  namespace: radiant-petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: radiant-petclinic-deployment

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70