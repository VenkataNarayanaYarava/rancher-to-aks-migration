name: Terraform AKS Provisioning

on:
  push:
    branches: ["main"]
    paths:
      - "migration-assessment/iac/terraform/**"

  pull_request:

  workflow_dispatch:

env:
  TF_WORKING_DIR: migration-assessment/iac/terraform

jobs:

# -------------------------
# 1. Terraform Validate & Plan
# -------------------------
  terraform-plan:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # -------------------------
      # Azure Login (OIDC)
      # -------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -------------------------
      # Setup Terraform
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # -------------------------
      # Terraform Init
      # -------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # -------------------------
      # Terraform Validate
      # -------------------------
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # -------------------------
      # Terraform Plan
      # -------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      # -------------------------
      # Upload Plan Artifact
      # -------------------------
      - name: Upload Plan
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


# -------------------------
# 2. Terraform Apply (Manual Approval)
# -------------------------
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production   # 👈 approval gate

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # -------------------------
      # Download Plan Artifact
      # -------------------------
      - name: Download Plan
        uses: actions/download-artifact@v6
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      # -------------------------
      # Terraform Apply
      # -------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan